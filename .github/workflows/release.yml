name: Build and publish desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source and tests
    runs-on: ubuntu-22.04
    steps:
      - name: Check out NEXUS-Q Vault
        uses: actions/checkout@v5

      - name: Install Linux desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check out pinned NEXUS-Q cryptographic engine
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/lecodev-26/nexus-q.git ../nexus-q
          git -C ../nexus-q checkout efe486603af266c379131526d8320a0584254ce4

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path apps/desktop/Cargo.toml -- --check

      - name: Run Clippy
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --manifest-path apps/desktop/Cargo.toml --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Verify desktop dependency lockfile
        run: cargo metadata --locked --manifest-path apps/desktop/Cargo.toml --format-version 1 > /dev/null

  build:
    needs: validate
    name: Build installers (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
            bundles: deb,appimage
            artifact_name: linux-installers
            artifact_path: |
              apps/desktop/target/release/bundle/deb/*.deb
              apps/desktop/target/release/bundle/appimage/*.AppImage
          - platform: windows
            os: windows-latest
            bundles: msi,nsis
            artifact_name: windows-installers
            artifact_path: |
              apps/desktop/target/release/bundle/msi/*.msi
              apps/desktop/target/release/bundle/nsis/*.exe
          - platform: macos
            os: macos-latest
            bundles: dmg
            artifact_name: macos-installer
            artifact_path: apps/desktop/target/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out NEXUS-Q Vault
        uses: actions/checkout@v5

      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check out pinned NEXUS-Q cryptographic engine
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/lecodev-26/nexus-q.git ../nexus-q
          git -C ../nexus-q checkout efe486603af266c379131526d8320a0584254ce4

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2.0.0' --locked

      - name: Verify dependency lockfile
        shell: bash
        run: cargo metadata --locked --manifest-path apps/desktop/Cargo.toml --format-version 1 > /dev/null

      - name: Build native installer bundles
        working-directory: apps/desktop
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt

      - name: Publish pre-release and attach installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NEXUS-Q Vault ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          body: |
            **Pre-release / alpha software. Not recommended for protecting high-value or irreplaceable data.**

            This release has not received an independent security audit. Review the README and SECURITY.md for known limitations before use.

            Installers are built on native GitHub-hosted runners for Linux, Windows and macOS. They are not yet code-signed or notarized.
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
