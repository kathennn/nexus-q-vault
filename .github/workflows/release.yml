name: Build and publish desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source and tests
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out NEXUS-Q Vault
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check out pinned NEXUS-Q cryptographic engine
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/lecodev-26/nexus-q.git ../nexus-q
          git -C ../nexus-q checkout efe486603af266c379131526d8320a0584254ce4

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path apps/desktop/Cargo.toml -- --check

      - name: Run Clippy
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --manifest-path apps/desktop/Cargo.toml --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Verify desktop dependency lockfile
        run: cargo metadata --locked --manifest-path apps/desktop/Cargo.toml --format-version 1 > /dev/null

  build:
    needs: validate
    name: Build installers (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            bundles: msi,nsis
            artifact_name: windows-installers
            artifact_path: |
              apps/desktop/target/release/bundle/msi/*.msi
              apps/desktop/target/release/bundle/nsis/*.exe
          - platform: macos
            os: macos-latest
            bundles: dmg
            artifact_name: macos-installer
            artifact_path: apps/desktop/target/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out NEXUS-Q Vault
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check out pinned NEXUS-Q cryptographic engine
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/lecodev-26/nexus-q.git ../nexus-q
          git -C ../nexus-q checkout efe486603af266c379131526d8320a0584254ce4

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2.0.0' --locked

      - name: Verify dependency lockfile
        shell: bash
        run: cargo metadata --locked --manifest-path apps/desktop/Cargo.toml --format-version 1 > /dev/null

      - name: Build native installer bundles
        working-directory: apps/desktop
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Flatten installer artifacts
        run: |
          find release-assets -mindepth 2 -type f -exec mv -t release-assets -- {} +
          find release-assets -mindepth 1 -type d -empty -delete

      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt

      - name: Publish public release and attach installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NEXUS-Q Vault v0.1.0
          prerelease: false
          generate_release_notes: true
          body: |
            **NEXUS-Q Vault v0.1.0 — first public release (early access).**

            This is an early-access release, not a security-audited or production-hardened product. It has not received an independent security audit and should not be the sole protection for high-value or irreplaceable data. Review README.md, SECURITY.md and THREAT_MODEL.md before use.

            **Installers**
            - Linux: `.deb` and `.AppImage`
            - Windows: `.msi` and `.exe`
            - macOS: `.dmg`

            Windows and macOS installers are built on native GitHub-hosted runners. Linux `.deb` and `.AppImage` installers are built on the project's Zorin OS 18.1 host and uploaded separately. Build provenance is not independently verified. Installers are not currently code-signed or notarized.

            **Integrity**
            `SHA256SUMS.txt` contains SHA-256 checksums to detect accidental corruption. Checksums are not digital signatures and do not authenticate the publisher.

            **Known limitations**
            - No independent security audit or production-hardening review.
            - No code signing or macOS notarization.
            - Keep `.nqx` files and folder-vault encrypted objects separately; `.nqb` backups do not contain those payloads.
            - Folder encryption currently has a 32 MiB per-file limit and does not preserve empty directories or symbolic links.

            **Full changelog**: https://github.com/lecodev-26/nexus-q-vault/compare/v0.1.0-alpha.1...v0.1.0
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
